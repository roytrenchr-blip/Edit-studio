name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VER="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect active Java version."
            exit 1
          fi
          JAVA_MAJOR="$(printf '%s' "$JAVA_VER" | awk -F. '{if ($1 == "1") print $2; else print $1}' | tr -dc '0-9')"
          if [ -z "$JAVA_MAJOR" ] || [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or higher is required, but detected version is '${JAVA_VER}'."
            exit 1
          fi
          echo "Verified Java major version: ${JAVA_MAJOR}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="$(command -v keytool || true)"
            fi
            if [ -z "$KEYTOOL_BIN" ]; then
              echo "Error: keytool binary not found."
              exit 1
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: Temporary ./debug.keystore is missing after keystore setup."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: Expected debug APK not found or invalid at ${APK_PATH}."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          echo "Verified APK: ${APK_PATH} ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_DIR="${RUNNER_TEMP}/release-asset"
          mkdir -p "$ASSET_DIR"
          cp "$SOURCE_APK" "${ASSET_DIR}/app-debug.apk"
          ASSET_PATH="${ASSET_DIR}/app-debug.apk"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi
          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist or is empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]] || [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be app-debug.apk."
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat <<EOF > "$NOTES_FILE"
          Automatically generated debug APK built by GitHub Actions.

          - Build Run Number: ${{ github.run_number }}
          - Run Attempt: ${{ github.run_attempt }}
          - Source Commit: ${{ github.sha }}
          - Intended for testing only (not a Play Store production release).
          - Signed only with a temporary debug keystore.
          EOF

          gh release create "$TAG" \
            "$ASSET_PATH" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          VERIFY_OUTCOME="${{ steps.verify_apk.outcome }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_URL="$(gh release view "$TAG" --json url --jq .url)"
            gh release view "$TAG"
            echo "Release Tag: ${TAG}"
            echo "Release Title: ${TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "Asset Filename: app-debug.apk"
            echo "Direct Download URL: ${DIRECT_URL}"
            echo "Backup Artifact: app-debug-apk"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "- **Direct APK URL:** ${DIRECT_URL}"
              echo "- **Release Tag:** ${TAG}"
              echo "- **Release Title:** ${TITLE}"
              echo "- **Release Page:** ${RELEASE_URL}"
              echo "- **Asset Filename:** \`app-debug.apk\`"
              echo "- **Backup Workflow Artifact:** \`app-debug-apk\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not succeed (outcome: ${RELEASE_OUTCOME}). Do not expect the latest release URL to serve this build's APK."
            if [ "$VERIFY_OUTCOME" = "success" ]; then
              echo "The debug APK build itself succeeded and the backup artifact 'app-debug-apk' remains available on this workflow run."
              {
                echo "## APK Release Warning"
                echo ""
                echo "GitHub Release creation failed or was skipped (outcome: \`${RELEASE_OUTCOME}\`). The latest release download URL does not contain this build's APK."
                echo ""
                echo "However, the debug APK build succeeded and the backup workflow artifact \`app-debug-apk\` remains available."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "The debug APK build did not succeed, so neither the release asset nor the 'app-debug-apk' backup artifact is available for this run."
              {
                echo "## APK Build Failed"
                echo ""
                echo "The debug APK build did not succeed (verification outcome: \`${VERIFY_OUTCOME}\`)."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
