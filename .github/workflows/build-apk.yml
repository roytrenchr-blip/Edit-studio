name: Build Edit Studio APK & ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Package APK and Source ZIP
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EditStudio-debug.apk
          zip -j dist/EditStudio-debug-apk.zip dist/EditStudio-debug.apk
          zip -r dist/EditStudio-source.zip . -x ".git/*" ".gradle/*" "app/build/*" "dist/*"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EditStudio-APK-and-ZIP
          path: dist/*

      - name: Publish APK & ZIP to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: Edit Studio v1.0.${{ github.run_number }} (APK + ZIP)
          files: |
            dist/EditStudio-debug.apk
            dist/EditStudio-debug-apk.zip
            dist/EditStudio-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
